services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-garage}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-garage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-garage}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: "8080"
      OPINET_API_KEY: ${OPINET_API_KEY:-}
      EV_CHARGER_API_KEY: ${EV_CHARGER_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_API_URL은 next build 시점에 클라이언트 번들에 박히므로 여기서(빌드 인자로)
      # 지정해야 한다 — environment:(런타임) 값은 이미 빌드된 번들에 아무 영향을 못 준다.
      # 기본값(""）은 Caddy가 /api/*를 api로 프록시하는 같은 오리진 상대경로를 의미한다.
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
      - web

  # --- 아래는 1단계(MVP) 범위 밖이라 지금은 뺐다. 필요해지는 시점에 주석 해제 ---

  # mosquitto:                          # OBD/GPS 수집을 MQTT로 Home Assistant에 노출하고 싶어지면
  #   image: eclipse-mosquitto:2
  #   restart: unless-stopped
  #   volumes:
  #     - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
  #     - mosquitto-data:/mosquitto/data

  # redis:                              # BullMQ로 백그라운드 작업을 분리해야 할 만큼 부하가 늘면
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redis-data:/data

volumes:
  pgdata:
  uploads:
